name: Sync Notion
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', 'data/study-notes-reviewed.json', 'scripts/prepare-subject-practice.mjs', 'scripts/sync-notion.mjs', 'scripts/sync-drive.mjs', 'scripts/cloud-snapshot.py', '.github/workflows/notion-sync.yml']
concurrency:
  group: notion-production-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      CONTENT_SOURCE: notion
      GOOGLE_DRIVE_FOLDER_ID: 1pg3lbrlzwxJClmKCMQEpZg-9aMIrHnwr
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NOTION_SYNC_DIR: ${{ github.workspace }}/.notion-sync
      OCR_MODEL_DIR: /usr/share/tesseract-ocr/5/tessdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr-eng tesseract-ocr-ben
      - run: npm ci --prefix frontend
      - run: uv sync --frozen
      - run: uv run python scripts/cloud-snapshot.py restore
      - run: node scripts/sync-notion.mjs --once --sync-only
      - run: node scripts/prepare-subject-practice.mjs
      - run: uv run python scripts/cloud-snapshot.py publish
