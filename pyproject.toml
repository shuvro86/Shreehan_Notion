[project]
name = "shreehan-hq"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "libsql>=0.1.11",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "npm ci --prefix frontend && npm --prefix frontend run build"
